<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mtr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b86ff"/>
      <stop offset="1" stop-color="#2f5fe0"/>
    </linearGradient>
  </defs>

  <!-- Brand badge -->
  <rect width="64" height="64" rx="15" fill="url(#mtr-bg)"/>

  <!-- Celebration sparks -->
  <g stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
    <path d="M32 4.5 V8"/>
    <path d="M22.5 6.8 l1.8 3.1"/>
    <path d="M41.5 6.8 l-1.8 3.1"/>
  </g>

  <!-- Medal "head": approved / made it -->
  <circle cx="32" cy="21" r="8.6" fill="#ffffff"/>
  <path d="M27.8 21.2 l2.8 2.8 L36.4 16.6" stroke="#f2c14e" stroke-width="3.1"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Thumbs-up (one cohesive gesture) -->
  <g fill="#ffffff">
    <!-- forearm / wrist, connected into the fist -->
    <rect x="18.5" y="45.5" width="12" height="11" rx="3"/>
    <!-- fist -->
    <rect x="29" y="40" width="17" height="16.5" rx="4.5"/>
    <!-- thumb, attached to fist top, angled up -->
    <rect x="27" y="29" width="7.6" height="14.5" rx="3.8"
          transform="rotate(-15 30.8 36.25)"/>
  </g>
  <!-- knuckle line to read the fist -->
  <path d="M33.5 47.5 h9" stroke="#2f5fe0" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>
</svg>
